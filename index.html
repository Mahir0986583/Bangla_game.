<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>বাংলাদেশ ওপেন ওয়ার্ল্ড</title>
<style>
:root{--bg:#000;--fg:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff}}
:root[data-theme=dark]{--bg:#000;--fg:#fff}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Bengali","Kalpurush",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;filter:saturate(1.2) contrast(1.06)}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38))}
#spd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:18px;font-weight:700;text-shadow:0 2px 8px #000;display:none}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding:12px 16px;border-radius:40px;border:2px solid #fff9;background:#0008;color:#fff;font-size:13px;display:none}
#js{position:fixed;width:110px;height:110px;margin:-55px;border:2px solid #fff6;border-radius:50%;display:none;pointer-events:none}
#jk{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff8}
#pb{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);width:40px;height:40px;border-radius:50%;border:2px solid #fff9;background:#0008;color:#fff;font-size:11px;padding:0}
#ph{position:fixed;z-index:40;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 56px);transform:scale(.65);transform-origin:top right;width:min(310px,calc(100vw - 32px));height:min(610px,82vh);padding:34px 14px 16px;border-radius:42px;background:linear-gradient(145deg,#34363b,#08090c 28%,#08090c 78%,#44464b);border:3px solid #73757b;display:none;text-align:center;box-shadow:0 22px 70px #000d,inset 0 0 0 2px #111;box-sizing:border-box}
#ph:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:76px;height:17px;border-radius:12px;background:#050608;box-shadow:inset 0 1px 2px #000}
#pt{position:relative;color:#fff;font-size:18px;font-weight:700;margin:0 0 14px;padding:4px 8px 10px;text-align:left;border-bottom:1px solid #ffffff28}
#pa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 7px;align-content:start;padding:8px 2px 74px;max-height:calc(100% - 100px);overflow-y:auto;scrollbar-width:none}
#pa button{display:flex;min-width:0;min-height:76px;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;background:transparent;color:#fff;border:0;border-radius:14px;padding:3px 2px;font-size:10px;line-height:1.25;white-space:normal}
#pa button:before{content:attr(data-icon);display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#6677da,#2942a1);font-size:23px;box-shadow:0 4px 10px #0007}
#pa button[data-a="bur"]:before{background:linear-gradient(145deg,#ffb052,#d5531c)}
#pa button[data-a="kac"]:before{background:linear-gradient(145deg,#ffdf76,#c57a11)}
#pa button[data-a="tea"]:before{background:linear-gradient(145deg,#bf8762,#653c26)}
#pa button[data-a="home"]:before{background:linear-gradient(145deg,#78d89b,#18784c)}
#pa button[data-a="earn"]:before{background:linear-gradient(145deg,#ffdc58,#d48600)}
#pa button[data-a="shop"]:before{background:linear-gradient(145deg,#80d68c,#13864d)}
#pa button.w{grid-column:auto;background:transparent}
#pa button:active{transform:scale(.96)}
#pa button.f{background:transparent}
#pm{position:absolute;left:18px;right:18px;bottom:26px;padding:12px 8px 20px;border-top:1px solid #ffffff2a;color:#e8eaf1;font-size:11px;opacity:.92}
#shop{position:fixed;z-index:55;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}
#shop .shopCard{width:min(430px,94vw);max-height:84vh;overflow:auto;background:#f6f1e4;color:#242321;border:3px solid #8c6840;border-radius:22px;padding:18px;box-shadow:0 14px 50px #000b}
#shop h3{margin:0 0 5px;color:#176343;font-size:22px}
#shop .shopBal{margin:0 0 12px;font-weight:700}
#shop .goods{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#shop button{border:0;border-radius:13px;padding:11px;background:#fff;color:#242321;text-align:left;font-size:14px;box-shadow:0 2px 6px #0002}
#shop button small{display:block;color:#176343;font-weight:700;margin-top:4px}
#shop button.closeShop{margin-top:12px;width:100%;text-align:center;background:#45544c;color:#fff}
#ts{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#000b;padding:6px 12px;border-radius:14px;opacity:0;transition:opacity .4s;pointer-events:none;font-size:13px;text-align:center;max-width:80%}
#cd{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:#0b6b4bdd;padding:4px 10px;border-radius:14px;font-size:12px;display:none}
#mn{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#0007;padding:3px 8px;border-radius:10px;font-size:12px}
#at{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);padding:12px 16px;border-radius:40px;border:2px solid #f66;background:#400a;color:#fff;font-size:13px;display:none}
#ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;font-size:26px;text-align:center;color:#f55}
#st{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 38px);background:#0007;padding:3px 8px;border-radius:10px;font-size:11px;line-height:1.35;white-space:pre-line}
#mu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:none;flex-wrap:wrap;gap:8px;justify-content:center;background:#000c;border-radius:16px;padding:10px;width:min(92vw,360px)}
#mu button{flex:1 1 40%;padding:10px 8px;border:0;border-radius:12px;background:#0b6b4b;color:#fff;font-size:14px}
#ad{position:fixed;inset:0;z-index:50;background:#000c;display:none;align-items:center;justify-content:center}
#cl{position:fixed;inset:0;z-index:60;background:#000c;display:none;align-items:center;justify-content:center}
.cd2{background:#14171f;border:2px solid #4a5370;border-radius:22px;padding:18px;width:min(86vw,320px);text-align:center;box-shadow:0 10px 40px #000}
.cd2 h3{margin:0 0 8px;font-size:22px}.cd2 p{margin:6px 0}
.cd2 button{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:14px;background:#0b6b4b;color:#fff;font-size:16px}
.cd2 button#adx{background:#3a3f4d;font-size:14px}
#cl .cd2{max-height:86vh;overflow:auto}
#cl .nm{font-size:15px;font-weight:700}
#cl .no{font-size:13px;opacity:.85;letter-spacing:1px}
#cl button.cx{background:#3a3f4d;font-size:14px}
#cl button.rg{background:#b71c1c}
.adv{height:150px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;animation:pl 1.2s infinite alternate}
.adv .big{font-size:26px;font-weight:700;margin-bottom:6px}
.bar{height:8px;border-radius:5px;background:#333;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ffc107}
@keyframes pl{to{filter:brightness(1.35)}}

const shopE=$('shop'),products=[

 shopE.style.display='flex'}

 if(b.hasAttribute('data-close')){shopE.style.display='none';openStore=null;return}

function atPump(){return !!(car&&!car.ai&&car.k!='ric'&&Math.hypot(car.x-FS.x,car.z-FS.z)<14)}

let fuelCall=null;
window.__bdCallEmergencyFuel=()=>{
 if(!car){toast('জরুরি পেট্রোল: গাড়িতে উঠে আবার কল করুন');return}
 if(car.k=='ric'){toast('রিকশায় ব্যাটারি চলে — পেট্রোল সার্ভিস শুধু গাড়ি/বাইকের জন্য');return}
 if(car._f==null)car._f=100;
 if(car._f>25){toast('জরুরি পেট্রোল শুধু ট্যাংক ২৫% বা কম হলে আসবে');return}
 if(fuelCall){toast('জরুরি পেট্রোলের গাড়ি পথে আছে');return}
 const price=450;
 if(window.__bdEconomy.balance()<price){toast('সার্ভিস চার্জ '+price.toLocaleString('bn-BD')+' ৳ — ব্যালেন্স যথেষ্ট নয়');return}
 const target=car,truck=veh('trk',20),tg=truck.m,steelTank=gm(0xe7e7e7,.4,.45),serviceRed=gm(0xc62828,.45,.2);
 ad2(tg,new T.BoxGeometry(2.1,1.8,2.1),gm(0xe8e8e8,.55,.25),-.6,1.65,0);
 ad2(tg,new T.CylinderGeometry(.62,.62,3.2,14).rotateZ(Math.PI/2),steelTank,-.6,2.15,0);
 ad2(tg,new T.BoxGeometry(.08,.48,1.4),serviceRed,-.6,2.15,.64);
 ad2(tg,new T.BoxGeometry(1.8,1.75,2),serviceRed,2.35,1.55,0);
 ad2(tg,new T.BoxGeometry(1.65,.85,1.84),gl,2.4,2.02,0);
 [-2.2,-.9,2.5].forEach(x=>[-1.05,1.05].forEach(z=>wheel(truck,.5,x,z,1)));
 truck.ai=null;truck.v=0;
 truck.x=target.x+Math.cos(target.a)*85;truck.z=target.z-Math.sin(target.a)*85;
 truck.a=Math.atan2(-(target.z-truck.z),target.x-truck.x);
 fuelCall={truck,target,price,done:false,t:0};
 toast('জরুরি জ্বালানি সার্ভিস পাঠানো হয়েছে — চার্জ '+price.toLocaleString('bn-BD')+' ৳')}
const canLeave=()=>RD&&(RD.k=='train'?(TR.s=='sA'||TR.s=='sB'):(PL.s=='wait'||PL.s=='park'));
function boardTrain(){RD={k:'train',y:Y+1.1};toast('ট্রেনে উঠলেন — স্টেশনে থামলে নামতে পারবেন')}
function leaveTrain(){RD=null;P.x=748;P.z=TR.z+5;P.y=Y;P.m.g.visible=true;toast('ট্রেন থেকে নামলেন')}
function boardPlane(){RD={k:'plane',y:PL.y+6};if(PL.s=='wait')PL.t=Math.max(PL.t,22);P.m.g.visible=false;toast('বিমানে উঠলেন — বিমান ছাড়ছে, শক্ত করে বসুন!')}
function leavePlane(){RD=null;P.x=PL.x-9;P.z=PL.z;P.y=Y;P.m.g.visible=true;fd.style.opacity=0;toast('বিমান থেকে নামলেন')}
const endRide=()=>{RD=null;P.m.g.visible=true;fd.style.opacity=0};
function ctx(){
 if(RD||window.__frz||car||P.roof||P.stairs)return null;
 if((TR.s=='sA'||TR.s=='sB')&&Math.abs(P.x-RX)<12&&Math.abs(P.z-TR.z)<24)return{t:'ট্রেনে উঠুন',fn:boardTrain};
 if(PL.vis&&(PL.s=='wait'||PL.s=='park')&&Math.hypot(P.x-PL.x,P.z-PL.z)<18)return{t:'বিমানে উঠুন',fn:boardPlane};
 return null}
const oT=toggle;
toggle=function(){
 if(atPump()){
  if(Math.abs(car.v)>=2){toast('পেট্রোল ভরার আগে পাম্পে গাড়ি থামান');return}
  const price=fuelPrice();if(price<=0){toast('ট্যাংক ইতিমধ্যে ফুল');return}
  if(window.__bdEconomy.charge(price)){car._f=100;FS.stay=0;say('পাম্প কর্মী','ধন্যবাদ স্যার, '+price.toLocaleString('bn-BD')+' ৳ দিয়ে ট্যাংক ফুল করা হলো')}
  return}
 const s=nearbyStore();if(s){showStore(s);return}
 if(RD){if(canLeave()){RD.k=='train'?leaveTrain():leavePlane()}return}
 const c=ctx();if(c){c.fn();return}
 return oT.apply(this,arguments)};
const oF=floorY;floorY=(x,z)=>{
 if(P.stairs){
  const b=P.stairs.b;P.x=b.stairX;P.z=cl(z,b.zEnd,b.zStart);
  const q=cl((b.zStart-P.z)/(b.zStart-b.zEnd),0,1),y=b.y+q*b.h;
  if(q>.995&&!P.stairs.down){P.stairs=null;P.roof={x0:b.x0+1,x1:b.x1-1,z0:b.z0+1,z1:b.z1-1,y:b.y,h:b.h,o:b,px:1};P.x=b.stairX;P.z=b.zEnd;toast('ছাদে পৌঁছেছেন — নামতে হলে সিঁড়ি দিয়ে নামুন')}
  else if(q<.015&&P.stairs.down){P.stairs=null;P.x=b.gate.x;P.z=b.gate.z+1;toast('সিঁড়ি বেয়ে নিচে নেমে গেট দিয়ে বের হলেন')}
  return y}
 return RD?RD.y:oF(x,z)};

function upd(dt){
 hideGrass();trainStep(dt);planeStep(dt);shipStep(dt);
 const o=car||P;
 for(const q of NP){q.p+=q.dir*1.3*dt;if(q.p>q.hi||q.p<q.lo)q.dir*=-1;q.t+=3*dt;
  const x=q.ax?q.p:q.f,z=q.ax?q.f:q.p,v=Math.hypot(x-o.x,z-o.z)<60;q.h.g.visible=v;
  if(v){walk(q.h,q.t,.8);q.h.g.position.set(x,Y,z);q.h.g.rotation.y=q.ax?q.dir*Math.PI/2:(q.dir>0?0:Math.PI)}}
 for(const h of ST)h.g.visible=Math.hypot(h.g.position.x-o.x,h.g.position.z-o.z)<60;
 for(const c of CR){const ph=tm*.35+c.o,x=843+(.5+.5*Math.sin(ph))*30,len=5+(.5+.5*Math.cos(ph*1.7))*14;
  c.tr.position.x=x;c.cb.scale.y=len;c.cb.position.set(x,Y+27-len/2,c.cz);c.ct.position.set(x,Y+27-len-1.3,c.cz)}
 for(const p of PUF){const ph=(tm*.12+p.o)%1;p.p.position.set(p.x,Y+31+ph*18,p.z);p.p.scale.setScalar(1+ph*1.2);p.m.opacity=.35*(1-ph)}
 /* জ্বালানি: গাড়ি চালালে কমে, পাম্পে মেনু থেকে টাকা দিয়ে ভরতে হয় */
 if(car&&!car.ai&&!RD&&car.k!='ric'){
  if(car._f==null)car._f=100;car._f=Math.max(0,car._f-Math.abs(car.v)*dt*.03);
  if(car._f<=0){car.v*=.8;if(tm-wf>8){wf=tm;toast('জ্বালানি শেষ! পেট্রোল পাম্পে গিয়ে থামুন (শহরের পূর্বে)')}}
  else if(car._f<15&&tm-wf>20){wf=tm;toast('জ্বালানি প্রায় শেষ — পেট্রোল পাম্প খুঁজুন')}
 }
 if(fuelCall){
  const f=fuelCall,t=f.truck,o=f.target,dx=o.x-t.x,dz=o.z-t.z,d=Math.hypot(dx,dz);
  if(!f.done&&d>5){const step=Math.min(d-4.5,16*dt);t.x+=dx/d*step;t.z+=dz/d*step;t.a=Math.atan2(-dz,dx)}
  else if(!f.done){
   if(window.__bdEconomy.charge(f.price)){o._f=100;f.done=true;f.t=0;say('জরুরি পেট্রোল','গাড়ির ট্যাংক ফুল করে দিলাম — '+f.price.toLocaleString('bn-BD')+' ৳ সার্ভিস চার্জ কাটা হয়েছে')}
   else{toast('ব্যালেন্স কম — জরুরি সার্ভিস চার্জ দিতে পারলেন না');f.done=true;f.t=5}
  }
  t.y=gh(t.x,t.z);t.m.position.set(t.x,t.y,t.z);t.m.rotation.y=t.a;
  if(f.done){f.t+=dt;if(f.t>4){scene.remove(t.m);const ix=cars.indexOf(t);if(ix>=0)cars.splice(ix,1);fuelCall=null}}
 }
 /* যাত্রী */
 if(RD){const g=P.m.g;
  if($('ov').style.display=='flex')endRide();
  else if(RD.k=='train'){P.x=RX+1;P.z=TR.z;RD.y=Y+1.1;g.visible=true;g.position.set(RX+.9,RD.y,TR.z);g.rotation.set(0,-Math.PI/2,0);sitP(P.m)}
  else{P.x=PL.x;P.z=PL.z;RD.y=PL.y+6;g.visible=false}}}
function post(){
 if(RD){act.style.display=canLeave()?'block':'none';if(canLeave())act.textContent=RD.k=='train'?'ট্রেন থেকে নামুন':'বিমান থেকে নামুন';$('at').style.display='none';window.__frz=1}

  const s=nearbyStore(),pump=atPump();
  if(pump){const p=fuelPrice();act.style.display='block';act.textContent=Math.abs(car.v)>=2?'পাম্পে থামুন':p?'পেট্রোল নিন · '+p.toLocaleString('bn-BD')+' ৳':'ট্যাংক ফুল'}
  else if(s){act.style.display='block';act.textContent='মুদি দোকান · কেনাকাটা'}

const _r=rn.render.bind(rn);let _t=performance.now();
rn.render=(sc,cm)=>{const n=performance.now(),dt=Math.min(.05,(n-_t)/1000);_t=n;tm+=dt;

 _r(sc,cm);
 try{post()}catch(e){if(!post.er){post.er=1;console.error('জাতীয় নগরী/post',e)}}};
setTimeout(()=>toast('নতুন: শহরের পূর্বে "জাতীয় নগরী" — পেট্রোল পাম্প, রেলস্টেশন, বিমানবন্দর, বন্দর!'),4000);
})();

<script>

(()=>{

['keydown','keyup','keypress'].forEach(t=>inp.addEventListener(t,e=>e.stopPropagation()));

 box.innerHTML='<iframe src="'+src+'" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';msg.textContent='বাজছে… (না বাজলে ইন্টারনেট দেখুন, কিছু গান বাইরে চালানো যায় না)'};

 recent.length?W('গত ১০ মিনিটে '+bn(recent.length)+' ধরনের ত্রুটি: '+recent.slice(-2).map(x=>x.m.slice(0,60)+(x.n>1?' ×'+bn(x.n):'')).join(' | ')):ok('কোনো ত্রুটি ধরা পড়েনি');
 try{(isFinite(P.x+P.y+P.z)&&P.y>-60)?ok('আপনার অবস্থান ঠিক আছে'):W('অবস্থান গোলমেলে — "বাড়ি" দিয়ে ঠিক করুন')}catch(e){}
 const s=snap();
 if(s.vehicle&&s.fuel!=null&&s.vehicle!=='ric')s.fuel<=25?W('জ্বালানি কম ('+bn(s.fuel)+'%) — পাম্প বা জরুরি পেট্রোল কল'):ok('জ্বালানি ঠিক ('+bn(s.fuel)+'%)');
 s.money!=null&&s.money<60?W('টাকা কম ('+bn(s.money)+' ৳) — আয় অ্যাপে বিজ্ঞাপন দেখুন'):ok('টাকা: '+bn(s.money)+' ৳');
 s.eaten<3?W('আজ খেয়েছেন '+bn(s.eaten)+'/৩ বার'):ok('আজকের খাওয়া ৩/৩ পূর্ণ');
 try{const r=A&&A.ttsReady?A.ttsReady():(window.speechSynthesis&&speechSynthesis.getVoices().some(v=>/^bn/i.test(v.lang)));r?ok('বাংলা ভয়েস প্রস্তুত'):W('বাংলা ভয়েস ডেটা নেই — টেক্সট-টু-স্পিচে বাংলা ইনস্টল করুন')}catch(e){}
 try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),3000);const r=await fetch('voice/ric_ask.mp3',{method:'HEAD',signal:c.signal});clearTimeout(tm);r.ok?ok('রিকশাওয়ালার অডিও ফাইল আছে'):W('রিকশাওয়ালার অডিও ফাইল পাওয়া যায়নি')}catch(e){W('রিকশাওয়ালার অডিও যাচাই করা গেল না')}
 ok(navigator.onLine?'ইন্টারনেট আছে (গান/অনলাইন ভয়েস চলবে)':'ইন্টারনেট নেই (মূল গেম চলবে; গান/অনলাইন ভয়েস চলবে না)');
 try{const m=performance.memory;if(m){m.usedJSHeapSize/m.jsHeapSizeLimit>.85?W('মেমরি প্রায় ভরা — অন্য অ্যাপ বন্ধ করুন'):ok('মেমরি ঠিক আছে')}}catch(e){}

function reportText(){
 const s=snap(),L=['BangladeshOpenWorld — মাহির রিপোর্ট',new Date().toLocaleString('bn-BD'),'অবস্থা: '+JSON.stringify(s),'FPS গড় '+Math.round(fpsAvg)+' / সর্বনিম্ন '+Math.round(fpsMin),'ডিভাইস: '+navigator.userAgent.slice(0,120)];
 L.push(LOG.length?'ত্রুটি লগ:':'ত্রুটি লগ: নেই');LOG.slice(-12).forEach(x=>L.push('- ['+x.k+'] '+x.m+(x.n>1?' ×'+x.n:'')));return L.join('\n')}
async function copyReport(){const t=reportText();try{await navigator.clipboard.writeText(t);say('কপি হয়েছে ✅')}catch(e){say('কপি করা গেল না। উপরের রিপোর্ট চেপে ধরে কপি করুন।')}}

/* প্রশ্নের উত্তর */
async function onlineAsk(){
 const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);
 try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-8),state:snap()}),signal:c.signal});const j=await r.json();return j&&j.text||null}
 catch(e){logErr('mahir-api',e.message||e);return null}finally{clearTimeout(tm)}}
async function answer(q){
 const t=fold(q);
 const d=best(DYNF,t),k=best(FOLDED,t);
 if(d.e&&d.s>=k.s&&d.s>=3)return await d.e.f();
 if(k.e&&k.s>=3)return{text:k.e.a};
 if(API_URL&&navigator.onLine){const r=await onlineAsk();if(r)return{text:r}}
 return{text:'ঠিক বুঝতে পারলাম না 😅 অন্যভাবে লিখে বা বলে দেখুন। যেমন:\n• কীভাবে খেলব?\n• টাকা কামাব কীভাবে?\n• পেট্রোল শেষ হলে কী করব?\n• রিকশা কীভাবে ডাকব?\n• আমি আটকে গেছি\n• সমস্যা আছে কিনা চেক করো'}}
async function ask(q,fromVoice){
 q=String(q||'').trim();if(!q)return;
 const f=fold(q);
 if(f.length<=14&&WAKE.test(f)&&words(stripWake(q))===0){addMsg('u',q);call();return}
 if(WAKE.test(f)&&words(stripWake(q))>=1)q=stripWake(q);
 addMsg('u',q);
 let r;try{r=await answer(q)}catch(e){logErr('mahir',e.message);r={text:'দুঃখিত, উত্তর বানাতে সমস্যা হলো। আবার চেষ্টা করুন।'}}
 say(r.text,r.actions)}

/* ---------- ভয়েস: ডাক শোনা ---------- */
let wr=null;
function webListen(cont){
 const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return false;
 try{wr=new S();wr.lang='bn-BD';wr.continuous=false;wr.interimResults=false;wr.maxAlternatives=3;
  wr.onresult=e=>{const a=[];for(const x of e.results[e.results.length-1])a.push(x.transcript);heard(a,cont?'wake':'once')};
  wr.onend=()=>{if(cont&&wakeOn)setTimeout(()=>{try{wr.start()}catch(_){}},400)};wr.onerror=()=>{};wr.start();return true}catch(e){return false}}
function setWake(v){
 wakeOn=v;g('mhw').classList.toggle('on',v);bt.classList.toggle('on',v);ls.set('bd_mahir_wake',v?'1':'0');
 sBtn.textContent=v?'শুনছি… "মাহির" বলুন':'গেম সহকারী';
 try{if(v){if(A&&A.startListening)A.startListening(true);else if(!webListen(true)){wakeOn=false;g('mhw').classList.remove('on');bt.classList.remove('on');say('এই ফোনে ভয়েসে ডাকার সুবিধা নেই। লিখে বা বাটন চেপে ডাকুন।')}}
  else{if(A&&A.stopListening)A.stopListening();else if(wr){try{wr.abort()}catch(e){}}}}catch(e){logErr('mahir',e.message)}}
function heard(alts,mode){
 try{if(!Array.isArray(alts))alts=[String(alts)];const first=alts[0]||'';if(!first)return;
  g('mhk').classList.remove('on');
  if(mode==='once'){open();ask(first,true);return}
  const hit=alts.find(a=>WAKE.test(fold(a)));
  if(hit){const rest=stripWake(hit);if(words(rest)>=2){open();ask(rest,true)}else call();return}
  if(Date.now()<awaitUntil){awaitUntil=0;open();ask(first,true)}
 }catch(e){logErr('mahir',e.message)}}
window.__mahirHeard=heard;
window.__mahirStatus=s=>{
 if(s==='denied'){setWake(false);g('mhk').classList.remove('on');say('মাইক্রোফোনের অনুমতি পাইনি। ফোনের সেটিংস থেকে অনুমতি দিলে আমাকে ডাকতে পারবেন; এখনকার জন্য লিখে জিজ্ঞেস করুন।')}
 else if(s==='unsupported'){setWake(false);g('mhk').classList.remove('on');say('এই ফোনে বাংলা ভয়েস শোনার সার্ভিস নেই (Google অ্যাপ/ভয়েস সার্ভিস লাগে)। লিখে জিজ্ঞেস করুন।')}
 else if(s==='idle')g('mhk').classList.remove('on')};

/* ---------- বাটন/ইভেন্ট ---------- */
bt.onclick=()=>{if(isOpen)close();else call()};

g('mhg').onclick=send;ip.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
[['🎮 কীভাবে খেলব','কীভাবে খেলব'],['💰 টাকা কামাই','টাকা কামাব কীভাবে'],['🍛 খাবার','খাওয়ার নিয়ম কী'],['⛽ পেট্রোল','পেট্রোল শেষ হলে কী করব'],['🚕 রিকশা/সিএনজি','রিকশা কীভাবে ডাকব'],['📊 আমার অবস্থা','আমার অবস্থা'],['🛠️ সমস্যা চেক','সমস্যা আছে কিনা চেক করো'],['🆘 আটকে গেছি','আমি আটকে গেছি']].forEach(([l,q])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>ask(q);qs.appendChild(b)});
addMsg('a','আমি মাহির 🤖 আপনার গেম সহকারী। গেমের নিয়ম, আটকে গেলে সমাধান, আর গেমে কোনো সমস্যা হলে আমিই জানাব। নিচের বাটন চাপুন, লিখুন, বা 🎙️ চালু করে "মাহির" বলে ডাকুন।');

/* ---------- রক্ষণাবেক্ষণ: নজরদারি ---------- */
let fN=0,fT=performance.now(),lowRun=0;
(function loop(t){fN++;
 if(t-fT>=3000){const f=fN*1000/(t-fT);fN=0;fT=t;
  if(document.visibilityState==='visible'){fpsHist.push(f);if(fpsHist.length>20)fpsHist.shift();fpsAvg=fpsHist.reduce((a,b)=>a+b,0)/fpsHist.length;fpsMin=Math.min.apply(null,fpsHist);
   lowRun=f<20?lowRun+1:0;
   if(lowRun>=2)notify('lag','🐢 গেম ধীর চলছে (~'+bn(f)+' ফ্রেম/সেকেন্ড)। ফোনে গ্রাফিক্স বাটন চেপে "মাঝারি" বা "অটো" করে দেখুন।',150000,'গেম ধীর চলছে। গ্রাফিক্স মাঝারি বা অটো করে দেখুন।')}}
 requestAnimationFrame(loop)})(performance.now());

let hold=0,ref=null;
setInterval(()=>{try{
 const c=(typeof car!=='undefined'&&car)?car:null,o=c||P;
 if(!isFinite(P.x)||!isFinite(P.z)||!isFinite(P.y)||P.y<-60){
  if(c){P.m.g.visible=true;c.v=0;car=null}P.roof=null;P.stairs=null;P.L=0;P.x=HX+3;P.z=HZ+10;P.y=VH0;
  logErr('fall','player position invalid — auto rescued');

  if(c._f<=0)notify('fuel0','⛽ জ্বালানি শেষ! গাড়ি আর চলবে না। ফোন > কন্টাক্ট > "জরুরি পেট্রোল সার্ভিস" (৪৫০ ৳) কল দিন, অথবা পূর্বের পাম্পে যান।',60000,'জ্বালানি শেষ। জরুরি পেট্রোল সার্ভিসে কল দিন।');
  else if(c._f<=25)notify('fuel25','⛽ জ্বালানি কম ('+bn(c._f)+'%)। পাম্পে যান, বা ফোন > কন্টাক্ট > জরুরি পেট্রোল সার্ভিস (৪৫০ ৳)।',180000,'জ্বালানি কম। পাম্পে যান বা জরুরি পেট্রোল সার্ভিসে কল দিন।')}
 const m=bal();if(m!=null&&m<60)notify('money','💰 টাকা কমে গেছে ('+bn(m)+' ৳)। ফোন > আয় অ্যাপে বিজ্ঞাপন দেখে +৩০ ৳ করে কামান।',300000,'টাকা কমে গেছে। আয় অ্যাপে বিজ্ঞাপন দেখে টাকা কামান।');
 const inp=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].some(k=>keys[k])||Math.hypot(jx||0,jy||0)>.35;
 if(window.__frz||!inp){hold=0;ref=null}
 else{hold++;if(!ref)ref={x:o.x,z:o.z,t:hold};
  if(hold-ref.t>=7){if(Math.hypot(o.x-ref.x,o.z-ref.z)<.5)notify('stuck','🧱 মনে হচ্ছে আটকে গেছেন। গাড়িতে থাকলে E চেপে নামুন, না হলে ফোন > "বাড়ি" চাপুন। চাইলে আমাকে বলুন "আমি আটকে গেছি"।',90000,'মনে হচ্ছে আটকে গেছেন। ফোন থেকে বাড়ি চাপুন।');ref={x:o.x,z:o.z,t:hold}}}
}catch(e){}},1000);
setInterval(()=>{try{const m=performance.memory;if(m&&m.usedJSHeapSize/m.jsHeapSizeLimit>.85)notify('mem','🧠 ফোনের মেমরি প্রায় ভরে গেছে। অন্য অ্যাপ বন্ধ করুন, নইলে গেম বন্ধ হয়ে যেতে পারে।',300000,'ফোনের মেমরি প্রায় ভরে গেছে। অন্য অ্যাপ বন্ধ করুন।')}catch(e){}},10000);

window.__mahir={ask,open,close,diagnose,report:reportText,snap};
})();
